services:
  fiebo-mysql:
    image: mysql:8.0
    container_name: fiebo_mysql
    environment:
      MYSQL_ROOT_PASSWORD: hieulun123
      MYSQL_DATABASE: FieboDb4
      TZ: Asia/Ho_Chi_Minh
    command: --default-time-zone='+07:00'
    volumes:
      - mysql_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "3308:3306"

  fiebo-redis:
    image: redis:alpine
    container_name: fiebo_redis
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "6379:6379"

  fiebo-api:
    build: 
      context: . 
      dockerfile: Dockerfile
    container_name: fiebo_api
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8080:8080"
    env_file:
      - ./src/Fiebo.API/.env 
    depends_on:
      - fiebo-mysql
      - fiebo-redis

volumes:
  mysql_data: